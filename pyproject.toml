[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flownest"
version = "1.0.0"
description = "One number for every channel pixel of a D8 grid: every river network object is one range of integers."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Lulu Jiang"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = ["numpy>=1.17", "numba"]

[project.optional-dependencies]
release = ["pyarrow", "rasterio"]
examples = ["pyarrow", "rasterio"]
crosswalks = ["pandas", "scipy", "pyarrow", "rasterio", "pyogrio", "geopandas", "shapely>=2.0"]
test = ["pytest", "pandas", "scipy", "pyarrow", "rasterio", "pyogrio", "geopandas", "shapely>=2.0"]

[tool.setuptools]
packages = ["flownest", "flownest.sword"]

[tool.setuptools.package-data]
"flownest.sword" = ["rename_map_sword_v17c_crosswalk.csv"]
